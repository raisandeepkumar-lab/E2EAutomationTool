name: Playwright CI

on:
  push:
    branches:
      - Development
  pull_request:
    branches:
      - Development
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libasound2t64 libxshmfence1 libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgtk-3-0 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_playwright_framework/requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests
        working-directory: python_playwright_framework
        run: |
          pytest -q tests
